name: Build MayaAssistant APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract MayaAssistant
        run: |
          rm -rf build-project
          mkdir build-project
          unzip -q MayaAssistant-GitHub-Ready.zip -d build-project

      - name: Build APK
        working-directory: build-project/MayaAssistant-PhoneBuild
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MayaAssistant-APK
          path: build-project/MayaAssistant-PhoneBuild/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
